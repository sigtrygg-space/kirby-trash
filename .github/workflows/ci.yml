name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-plugins --no-interaction --no-progress

      - run: vendor/bin/phpunit

  # the committed index.js/index.css must always match a fresh build
  # of the panel sources — a stale build must never reach main or a
  # release, since installs use the committed files as-is
  panel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Fail if the committed build is stale
        run: |
          if ! git diff --exit-code -- index.js index.css; then
            echo "::error::index.js/index.css are stale — run 'npm run build' and commit the result"
            exit 1
          fi

  # release.yml only fires on a push to main that touches composer.json,
  # so nothing else in CI ever runs its scripts — without this job the
  # first execution of a change to them would be an actual release,
  # unattended and with `contents: write`
  release-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Exercise the release workflow's run blocks
        run: |
          # -m pip installs into the same interpreter the harness parses with
          python3 -c 'import yaml' 2> /dev/null || python3 -m pip install --quiet pyyaml
          bash .github/scripts/test-release-workflow.sh
