name: Release

# Tags and publishes a GitHub release whenever the `version` in
# composer.json changes on main. Releasing therefore means: bump the
# version and date the CHANGELOG in a PR — merging it releases.
# The tag is derived from the version field, so the two can never
# drift apart (Packagist skips tags that don't match the field).

on:
  push:
    branches: [main]
    paths: [composer.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the version from composer.json
        id: composer
        run: |
          version="$(jq -r '.version // empty' composer.json)"

          # composer.json is repository content, so the version field is
          # attacker-influenceable via any merged PR. It ends up in a git
          # tag and a release title, so accept nothing but a plain semver
          # string: that keeps shell metacharacters and newlines (which
          # would forge extra step outputs) out of every later step.
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::composer.json has an unusable version field"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # NOTE: never interpolate `${{ … }}` inside a `run:` block — GitHub
      # substitutes it textually before bash parses the script, which turns
      # any value into executable shell. Pass values through `env:` and
      # reference them as quoted shell variables, as all steps below do.
      - name: Check whether the version is already tagged
        id: tag
        env:
          VERSION: ${{ steps.composer.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the release notes from the CHANGELOG
        if: steps.tag.outputs.new == 'true'
        env:
          VERSION: ${{ steps.composer.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # match the heading literally: `~` would treat the version as a
          # regex, where `.` matches any character and a `+` from build
          # metadata acts as a quantifier — the first silently pulls in a
          # foreign section, the second misses the heading altogether and
          # publishes the fallback note. The exit rule comes first so the
          # section always ends at the next heading.
          awk -v ver="$VERSION" '
            /^## / && flag { exit }
            $0 == "## " ver || index($0, "## " ver " ") == 1 { flag = 1; next }
            flag { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "See the [CHANGELOG](https://github.com/$REPOSITORY/blob/main/CHANGELOG.md)." > release-notes.md
          fi

      - name: Create the tag and the release
        if: steps.tag.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.composer.outputs.version }}
        run: |
          # 0.x versions are published as pre-releases
          case "$VERSION" in
            0.*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac

          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            $prerelease
